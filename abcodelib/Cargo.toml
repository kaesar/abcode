[package]
name = "abcodelib"
version = "0.7.0"
edition = "2024"
rust-version.workspace = true
description = "ABCode Library - Core compilation and JS execution for ABCode"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
rust-embed = "8.14"
boa_engine = "0.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
